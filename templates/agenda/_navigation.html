{% comment %}Barre de navigation d'une vue : flèches, période, « Aujourd'hui » à droite (comme le CRM).{% endcomment %}
<div class="agenda__barre">
  <div class="agenda__periode">
    <a class="agenda__fleche" href="{{ url_precedent }}" aria-label="{{ libelle_precedent }}"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m15 18-6-6 6-6"/></svg></a>
    <h2>{{ titre|capfirst }}</h2>
    <a class="agenda__fleche" href="{{ url_suivant }}" aria-label="{{ libelle_suivant }}"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9 6 6 6-6 6"/></svg></a>
  </div>
  <a class="agenda__aujourdhui" href="{{ url_aujourdhui }}">Aujourd'hui</a>
</div>
