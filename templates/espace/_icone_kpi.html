{% comment %}Pastille d'icône d'un chiffre clé, comme les KPI du CRM Vanessa.{% endcomment %}
<span class="tuile__icone{% if cle == 'demandes' or cle == 'taux_conversion' %} tuile__icone--succes{% elif cle == 'taux_rebond' or cle == 'duree_moyenne' %} tuile__icone--accent{% endif %}" aria-hidden="true">
  <svg viewBox="0 0 24 24" focusable="false">
    {% if cle == "visiteurs" %}<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/>
    {% elif cle == "visites" %}<path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/>
    {% elif cle == "pages_vues" %}<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>
    {% elif cle == "pages_par_visite" %}<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>
    {% elif cle == "duree_moyenne" %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
    {% elif cle == "taux_rebond" %}<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>
    {% elif cle == "demandes" %}<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/>
    {% else %}<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>{% endif %}
  </svg>
</span>
