{% comment %}Conseil : une feuille de route qui avance, du cadrage à la transmission. Décoratif.{% endcomment %}
<svg class="visuel-page" viewBox="0 0 480 400" focusable="false">
  <rect x="10" y="10" width="460" height="380" rx="22" fill="#ffffff" fill-opacity="0.78" stroke="#dcd7cd"/>
  <text x="38" y="48" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1.5" fill="#5c6672">FEUILLE DE ROUTE</text>

  <g transform="translate(38 68)">
    <rect width="176" height="104" rx="12" fill="#f6f3ee" stroke="#dcd7cd"/>
    <text x="16" y="26" font-family="JetBrains Mono, monospace" font-size="9.5" letter-spacing="1.2" fill="#5c6672">CAS D'USAGE PRIORISÉS</text>
    <rect class="barre-grandit" x="16" y="40" width="140" height="10" rx="5" fill="#d96a34"/>
    <rect class="barre-grandit" x="16" y="60" width="104" height="10" rx="5" fill="#1e63a8" style="animation-delay:-0.8s"/>
    <rect class="barre-grandit" x="16" y="80" width="70" height="10" rx="5" fill="#3f8f7a" style="animation-delay:-1.6s"/>
  </g>

  <path d="M70 318Q128 318 172 262T296 180T420 104" fill="none" stroke="#dcd7cd" stroke-width="3" stroke-linecap="round"/>
  <path class="ia-flux" d="M70 318Q128 318 172 262T296 180" fill="none" stroke="#d96a34" stroke-width="3" stroke-linecap="round"/>

  <g font-family="Instrument Sans, sans-serif" font-size="13" font-weight="600" fill="#0e2c4b" text-anchor="middle">
    <circle cx="70" cy="318" r="13" fill="#2e6b5a"/>
    <path d="m64 318 4 4 8-8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="352">Cadrage</text>

    <circle cx="172" cy="262" r="13" fill="#2e6b5a"/>
    <path d="m166 262 4 4 8-8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="172" y="296">Conception</text>

    <circle class="ia-halo" cx="296" cy="180" r="20" fill="#d96a34" fill-opacity="0.3"/>
    <circle cx="296" cy="180" r="13" fill="#d96a34"/>
    <circle cx="296" cy="180" r="4.5" fill="#fff"/>
    <text x="296" y="214">Production</text>

    <circle cx="420" cy="104" r="13" fill="#fff" stroke="#b9b2a7" stroke-width="2"/>
    <text x="420" y="138">Transmission</text>
  </g>

  <g transform="translate(272 290)">
    <rect width="178" height="62" rx="12" fill="#0e2c4b"/>
    <circle class="point-actif" cx="22" cy="31" r="5" fill="#3f8f7a"/>
    <text x="36" y="27" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1" fill="#8fa6bf">EN COURS</text>
    <text x="36" y="44" font-family="Instrument Sans, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Mise en production</text>
  </g>
</svg>
